name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          shellcheck -x \
            -e SC2162 \
            -e SC1091 \
            -e SC2088 \
            -e SC2317 \
            scripts/*.sh \
            update.sh \
            install.sh \
            bin/dotfiles \
            bin/dotfiles-* \
            bin/work-* \
            bin/repos-clone \
            bin/_work-helpers \
            bin/erb-lint-formatter \
            bin/rubocop-auto \
            .config/aerospace/scripts/*.sh \
            .config/sketchybar/sketchybarrc \
            .config/sketchybar/colors.sh \
            .config/sketchybar/plugins/*.sh \
            .config/borders/bordersrc \
            .config/claude/statusline-command.sh \
            tests/test-*.sh
      - name: Command metadata headers
        run: bin/dotfiles commands --check
      - name: Keybinding cheatsheet is current
        run: bin/dotfiles keys --check

  tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - idempotency
          - work-nuke
          - repos-clone
          - ssh-adversarial
          - theme
          - update
          - doctor
          - setup-git
          - work-status
          - backup
          - sync
          - packages
          - uninstall
          - theme-render
          - cli
          - toggle
          - keys
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 5.x
        # macOS /bin/bash is 3.2 (Apple licensing). The install path itself
        # stays 3.2-compatible (no `declare -A`), but the test harnesses use
        # bash 4+ features. Brew installs bash 5+ at /opt/homebrew/bin which
        # we then call explicitly below.
        run: brew install bash
      - name: Run ${{ matrix.suite }} tests
        run: /opt/homebrew/bin/bash tests/test-${{ matrix.suite }}.sh
