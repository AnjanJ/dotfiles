name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR cancels the run it replaces: the
# tests matrix is one macOS job per suite, billed at ten times Linux
# minutes, and the newer commit is tested anyway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          shellcheck -x \
            -e SC2162 \
            -e SC1091 \
            -e SC2088 \
            -e SC2317 \
            scripts/*.sh \
            scripts/git-hooks/* \
            update.sh \
            install.sh \
            bin/dotfiles \
            bin/dotfiles-* \
            bin/work-* \
            bin/repos-clone \
            bin/_work-helpers \
            bin/_launcher-helpers \
            bin/erb-lint-formatter \
            bin/rubocop-auto \
            .config/aerospace/scripts/*.sh \
            .config/sketchybar/sketchybarrc \
            .config/sketchybar/plugins/*.sh \
            .config/borders/bordersrc \
            .config/claude/statusline-command.sh \
            .config/claude/handoff-check.sh \
            tests/base-test.sh \
            tests/run \
            tests/*-test.sh \
            tests/e2e/*.sh
      - name: Command metadata headers
        run: bin/dotfiles commands --check
      - name: Keybinding cheatsheet is current
        run: bin/dotfiles keys --check
      - name: Keybindings have no duplicate chords, undescribed bindings or missing scripts
        run: bin/dotfiles keys --lint

  # Pull requests only: scans what the PR adds (lines, file names, commit
  # messages) against the PRIVATE_WORDS secret, a shared list in the
  # private-words format, so a commit made with --no-verify or on a
  # machine with no list is still caught before merge. Reports only file,
  # line and commit, never the matched text. Skipped when the secret is
  # unset, and on PRs from forks, which GitHub gives no secrets.
  private-words:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the pull request for private words
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$PRIVATE_WORDS" ]; then
            echo "No PRIVATE_WORDS secret here (unset, or a PR from a fork); skipped."
            exit 0
          fi
          list="$RUNNER_TEMP/private-words"
          printf '%s\n' "$PRIVATE_WORDS" > "$list"
          DOTFILES_PRIVATE_WORDS="$list" DOTFILES_PRIVATE_WORDS_DIR="$RUNNER_TEMP/none" \
            DOTFILES_PRIVATE_WORDS_QUIET=1 \
            bash scripts/git-hooks/private-words range "origin/$BASE_REF" HEAD

  # The suite list is discovered from tests/*-test.sh so a new suite is
  # covered the moment it exists; nothing here to keep in step.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          suites=$(ls tests/*-test.sh \
            | sed -E 's|^tests/||; s|-test\.sh$||' \
            | grep -vx base \
            | jq -R . | jq -sc .)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Discovered: $suites"

  tests:
    needs: discover
    runs-on: macos-latest
    # A suite takes a few minutes with the bash install; a hang should not
    # hold a runner for GitHub's six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 5.x
        # macOS /bin/bash is 3.2 (Apple licensing). The install path itself
        # stays 3.2-compatible (no `declare -A`), but the test harnesses use
        # bash 4+ features. Brew installs bash 5+ at /opt/homebrew/bin which
        # we then call explicitly below.
        run: brew install bash
      - name: Run ${{ matrix.suite }} suite
        run: /opt/homebrew/bin/bash tests/run ${{ matrix.suite }}

  # The real install.sh, under stock /bin/bash 3.2, into a fresh HOME with
  # only the core package group. Slow and stateful, so it is its own job
  # rather than a discovered suite.
  install-e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fresh install with --groups core
        run: /bin/bash tests/e2e/install-e2e.sh
