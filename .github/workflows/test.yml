name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x \
            -e SC2162 \
            -e SC1091 \
            -e SC2088 \
            scripts/_helpers.sh \
            scripts/health-check.sh \
            scripts/setup-git.sh \
            scripts/setup-ssh.sh \
            scripts/apply-theme.sh \
            scripts/theme-utils.sh \
            update.sh \
            install.sh \
            bin/dotfiles \
            bin/dotfiles-update \
            bin/dotfiles-health \
            bin/dotfiles-theme \
            bin/dotfiles-install \
            bin/dotfiles-uninstall \
            bin/work-setup \
            bin/work-nuke \
            bin/work-switch \
            bin/work-status \
            bin/repos-clone

  idempotency:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run idempotency tests
        run: bash tests/test-idempotency.sh

  work-nuke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run work-nuke tests
        run: bash tests/test-work-nuke.sh

  repos-clone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repos-clone tests
        run: bash tests/test-repos-clone.sh

  ssh-adversarial:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SSH adversarial tests
        run: bash tests/test-ssh-adversarial.sh

  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run update.sh tests
        run: bash tests/test-update.sh
