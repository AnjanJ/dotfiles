name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          shellcheck -x \
            -e SC2162 \
            -e SC1091 \
            -e SC2088 \
            -e SC2317 \
            scripts/*.sh \
            update.sh \
            install.sh \
            bin/dotfiles \
            bin/dotfiles-* \
            bin/work-* \
            bin/repos-clone \
            bin/_work-helpers \
            bin/erb-lint-formatter \
            tests/test-*.sh

  tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - idempotency
          - work-nuke
          - repos-clone
          - ssh-adversarial
          - theme
          - update
          - doctor
          - setup-git
          - work-status
          - backup
          - sync
          - packages
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.suite }} tests
        # Use bash 5.x from PATH (Homebrew). macOS /bin/bash is 3.2 and lacks
        # `declare -A`, which package-utils.sh requires.
        shell: bash -e {0}
        run: bash tests/test-${{ matrix.suite }}.sh
