# Lazygit Configuration
# Beautiful Terminal UI for Git

gui:
  # Colours: rendered per theme into $DOTFILES_THEME_DIR/lazygit.yml and
  # merged via LG_CONFIG_FILE (set in .zshrc-terminal-enhancements).

  # Window size
  windowSize: 'normal'

  # Scroll behavior
  scrollHeight: 2
  scrollPastBottom: true

  # Mouse support
  mouseEvents: true

  # Show command log
  showCommandLog: false

  # Show file icons
  showFileTree: true
  showRandomTip: false

  # Border style
  border: 'rounded'

  # Commit message length
  commitLength:
    show: true

git:
  # Paging
  paging:
    colorArg: always
    pager: 'delta --dark --paging=never'
    useConfig: false

  # Commit
  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72

  # Merging
  merging:
    manualCommit: false
    args: ''

  # Pulling
  pull:
    mode: 'merge'

  # Skip hooks
  skipHookPrefix: WIP

  # Auto-fetch
  autoFetch: true
  autoRefresh: true
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'

  # Override git command
  overrideGpg: false
  disableForcePushing: false
  parseEmoji: true

# Refresh frequency
refresher:
  refreshInterval: 10
  fetchInterval: 60

# Key bindings
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
    quitWithoutChangingDirectory: 'Q'
    togglePanel: '<tab>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevItem-alt: 'k'
    nextItem-alt: 'j'
    prevPage: ','
    nextPage: '.'
    scrollLeft: 'H'
    scrollRight: 'L'
    gotoTop: '<'
    gotoBottom: '>'
    toggleRangeSelect: 'v'
    rangeSelectDown: '<s-down>'
    rangeSelectUp: '<s-up>'
    prevBlock: '<left>'
    nextBlock: '<right>'
    prevBlock-alt: 'h'
    nextBlock-alt: 'l'
    nextMatch: 'n'
    prevMatch: 'N'
    startSearch: '/'
    optionMenu: 'x'
    optionMenu-alt1: '?'
    select: '<space>'
    goInto: '<enter>'
    confirm: '<enter>'
    confirmInEditor: '<a-enter>'
    remove: 'd'
    new: 'n'
    edit: 'e'
    openFile: 'o'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    scrollUpMain-alt1: 'K'
    scrollDownMain-alt1: 'J'
    scrollUpMain-alt2: '<c-u>'
    scrollDownMain-alt2: '<c-d>'
    executeCustomCommand: ':'
    createRebaseOptionsMenu: 'm'
    pushFiles: 'P'
    pullFiles: 'p'
    refresh: 'R'
    createPatchOptionsMenu: '<c-p>'
    nextTab: ']'
    prevTab: '['
    nextScreenMode: '+'
    prevScreenMode: '_'
    undo: 'z'
    redo: '<c-z>'
    filteringMenu: '<c-s>'
    diffingMenu: 'W'
    diffingMenu-alt: '<c-e>'
    copyToClipboard: '<c-o>'
    openRecentRepos: '<c-r>'
    submitEditorText: '<enter>'
    extrasMenu: '@'
    toggleWhitespaceInDiffView: '<c-w>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'

# Custom commands (can add Rails-specific ones here)
customCommands:
  - key: 'C'
    command: 'git commit --verbose'
    description: 'Commit with full diff in editor'
    context: 'files'
    loadingText: 'Opening editor'
    subprocess: true

# Disable confirmation for certain actions
confirmOnQuit: false
quitOnTopLevelReturn: false

# OS-specific settings
os:
  editPreset: 'nvim'
  open: 'open {{filename}}'
  openLink: 'open {{link}}'

# Notifications
notARepository: 'skip'
promptToReturnFromSubprocess: false
