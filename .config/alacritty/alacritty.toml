# ============================================
# ALACRITTY CONFIGURATION
# ============================================
# Author: AJ
# Mirrors the wezterm style (Aura theme, JetBrainsMono Nerd Font, blurred
# translucent background, CMD-driven keybinds where Alacritty supports them).
#
# Install: alacritty is built from source via cargo (see install.sh).
#   The homebrew cask is deprecated for failing macOS Gatekeeper; the
#   `make app` target ad-hoc signs the bundle, which Gatekeeper accepts.
# ============================================

[env]
TERM = "alacritty"

# ── Window ────────────────────────────────────────────────────────────────────
[window]
opacity = 0.96
blur = true
decorations = "buttonless"
dynamic_padding = true
option_as_alt = "OnlyLeft"      # matches wezterm's send_composed_key_when_left_alt_is_pressed=false
padding = { x = 10, y = 10 }
startup_mode = "Windowed"

[window.dimensions]
columns = 140
lines = 40

# ── Scrolling ─────────────────────────────────────────────────────────────────
[scrolling]
history = 50000
multiplier = 3

# ── Font (JetBrainsMono Nerd Font + ligatures) ────────────────────────────────
[font]
size = 16.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Medium Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# ── Aura theme (matches wezterm palette exactly) ──────────────────────────────
[colors.primary]
foreground = "#edecee"
background = "#15141b"

[colors.cursor]
text   = "#15141b"
cursor = "#a277ff"

[colors.selection]
text       = "#edecee"
background = "#29263c"

[colors.normal]
black   = "#110f18"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#a277ff"
magenta = "#a277ff"
cyan    = "#61ffca"
white   = "#edecee"

[colors.bright]
black   = "#4d4d4d"
red     = "#ff6767"
green   = "#61ffca"
yellow  = "#ffca85"
blue    = "#a277ff"
magenta = "#a277ff"
cyan    = "#61ffca"
white   = "#edecee"

# ── Cursor ────────────────────────────────────────────────────────────────────
[cursor]
unfocused_hollow = true

[cursor.style]
shape    = "Block"
blinking = "On"

# ── Bell (silent, matches wezterm audible_bell=Disabled) ──────────────────────
[bell]
duration = 0

# ── Mouse ─────────────────────────────────────────────────────────────────────
[mouse]
hide_when_typing = true

# ── Keybinds (CMD-driven on macOS) ────────────────────────────────────────────
# Alacritty has no panes, but native tabs landed in 0.17. There is no
# CloseTab action — CMD-W maps to Quit, which closes the current tab
# (or the window if it's the last tab), matching most macOS apps.
# SelectAll also does not exist as an action; copy is selection-based.
[keyboard]
bindings = [
  # Windows + tabs
  { key = "N",      mods = "Command",        action = "CreateNewWindow" },
  { key = "T",      mods = "Command",        action = "CreateNewTab" },
  { key = "W",      mods = "Command",        action = "Quit" },
  { key = "LBracket",  mods = "Command|Shift", action = "SelectPreviousTab" },
  { key = "RBracket",  mods = "Command|Shift", action = "SelectNextTab" },
  { key = "Key1",   mods = "Command",        action = "SelectTab1" },
  { key = "Key2",   mods = "Command",        action = "SelectTab2" },
  { key = "Key3",   mods = "Command",        action = "SelectTab3" },
  { key = "Key4",   mods = "Command",        action = "SelectTab4" },
  { key = "Key5",   mods = "Command",        action = "SelectTab5" },
  { key = "Key6",   mods = "Command",        action = "SelectTab6" },
  { key = "Key7",   mods = "Command",        action = "SelectTab7" },
  { key = "Key8",   mods = "Command",        action = "SelectTab8" },
  { key = "Key9",   mods = "Command",        action = "SelectLastTab" },

  # Font size (matches the system-wide CMD-+/-/0 expectation)
  { key = "Equals", mods = "Command",        action = "IncreaseFontSize" },
  { key = "Plus",   mods = "Command",        action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Command",        action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Command",        action = "ResetFontSize" },

  # Copy / paste
  { key = "C",      mods = "Command",        action = "Copy" },
  { key = "V",      mods = "Command",        action = "Paste" },

  # Scrollback + search (matches wezterm CMD-f / CMD-k)
  { key = "F",      mods = "Command",        action = "SearchForward" },
  { key = "F",      mods = "Command|Shift",  action = "SearchBackward" },
  { key = "K",      mods = "Command",        action = "ClearHistory" },
  { key = "K",      mods = "Command",        chars = "\f"               },

  # Fullscreen
  { key = "Return", mods = "Command",        action = "ToggleFullscreen" },

  # Vi mode + hint launching (Alacritty's answer to wezterm QuickSelect)
  { key = "Space",  mods = "Command|Shift",  action = "ToggleViMode" },
]

# ── Hints: CMD-click stack-trace paths (mirrors wezterm hyperlink_rules) ──────
[[hints.enabled]]
command         = "open"
hyperlinks      = true
post_processing = true
persist         = false
mouse           = { enabled = true, mods = "Command" }
binding         = { key = "O", mods = "Command|Shift" }
  regex           = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^ <>"\s{-}\^⟨⟩`]+'

# ── Live config reload (matches wezterm CMD-Shift-R) ──────────────────────────
[general]
live_config_reload = true
