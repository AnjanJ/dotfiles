# Theme registry for catppuccin (Mocha variant)
# Used by apply-theme.sh — no hardcoded values needed

# Ghostty
ghostty_theme="catppuccin-mocha"
ghostty_custom_file=""

# Neovim
nvim_plugin_file="catppuccin-theme.lua"
nvim_colorscheme="catppuccin-mocha"

# Zellij
zellij_theme_file="catppuccin.kdl"
zellij_theme_name="catppuccin"

# Starship
starship_palette="catppuccin"

# VS Code
vscode_theme="Catppuccin Mocha"

# Zed
zed_theme="Catppuccin Mocha"

# bat / delta
bat_theme="Catppuccin Mocha"
delta_theme="Catppuccin Mocha"

# fzf
fzf_colors="fg:#cdd6f4,bg:#1e1e2e,hl:#f38ba8,fg+:#cdd6f4,bg+:#313244,hl+:#f38ba8,info:#cba6f7,prompt:#cba6f7,pointer:#f5e0dc,marker:#a6e3a1,spinner:#f5e0dc,header:#6c7086"

# borders (JankyBorders) — ARGB format 0xAARRGGBB
borders_active="0xffb4befe"
borders_inactive="0xff6c7086"
borders_background="0x301e1e2e"

# Warp (custom YAML — not built into Warp)
warp_theme="Catppuccin-mocha"
warp_custom_file="warp/catppuccin-mocha.yaml"
