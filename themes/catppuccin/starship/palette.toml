[palettes.catppuccin]
# Catppuccin Mocha palette
# https://github.com/catppuccin/catppuccin

# Background and Foreground
background = "#1e1e2e"
foreground = "#cdd6f4"

# Standard Colors
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

# Bright Colors
bright_black = "#585b70"
bright_red = "#f38ba8"
bright_green = "#a6e3a1"
bright_yellow = "#f9e2af"
bright_blue = "#89b4fa"
bright_magenta = "#f5c2e7"
bright_cyan = "#94e2d5"
bright_white = "#a6adc8"

# Additional Catppuccin Colors
purple = "#cba6f7"      # Mauve - primary accent
orange = "#fab387"      # Peach - secondary accent
pink = "#f5c2e7"        # Pink
teal = "#94e2d5"        # Teal
lavender = "#b4befe"    # Lavender
