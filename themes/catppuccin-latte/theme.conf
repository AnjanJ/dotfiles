# Theme registry for catppuccin-latte (light)
# Colours live in colors.toml; this file holds the settings templates
# cannot derive from a palette (editor theme names, custom files).

# Neovim: plugin spec in nvim/<file>, and the colorscheme it provides
nvim_plugin_file="catppuccin-latte-theme.lua"
nvim_colorscheme="catppuccin-latte"

# Editors (theme names as the apps know them; both come from the
# Catppuccin extension: catppuccin.catppuccin-vsc / Zed "catppuccin")
vscode_theme="Catppuccin Latte"
zed_theme="Catppuccin Latte"

# bat / delta syntax theme (bat ships Catppuccin Latte)
bat_theme="Catppuccin Latte"
delta_theme="Catppuccin Latte"

# Warp (built-in theme name, or a custom YAML shipped in warp/)
warp_theme="Catppuccin-latte"
warp_custom_file="warp/catppuccin-latte.yaml"
