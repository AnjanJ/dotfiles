# Theme registry for tokyo-night
# Used by apply-theme.sh — no hardcoded values needed

# Ghostty
ghostty_theme="tokyonight_night"
ghostty_custom_file=""

# Neovim
nvim_plugin_file="tokyo-night-theme.lua"
nvim_colorscheme="tokyonight"

# Zellij
zellij_theme_file="tokyo-night.kdl"
zellij_theme_name="tokyo-night"

# Starship
starship_palette="tokyonight"

# VS Code
vscode_theme="Tokyo Night"

# Zed
zed_theme="Tokyo Night"

# bat / delta
bat_theme="TwoDark"
delta_theme="TwoDark"

# fzf
fzf_colors="fg:#c0caf5,bg:#1a1b26,hl:#ff9e64,fg+:#c0caf5,bg+:#292e42,hl+:#ff9e64,info:#7aa2f7,prompt:#7dcfff,pointer:#bb9af7,marker:#9ece6a,spinner:#bb9af7,header:#565f89"

# borders (JankyBorders) — ARGB format 0xAARRGGBB
borders_active="0xff7aa2f7"
borders_inactive="0xff565f89"
borders_background="0x301a1b26"

# Warp (built-in theme name, or custom YAML filename without extension)
warp_theme="Tokyo Night"
warp_custom_file=""
