# Theme registry for aura
# Used by apply-theme.sh — no hardcoded values needed

# Ghostty
ghostty_theme="Aura"
ghostty_custom_file="ghostty/themes/Aura"

# Neovim
nvim_plugin_file="aura-theme.lua"
nvim_colorscheme="aura-dark"

# Zellij
zellij_theme_file="aura.kdl"
zellij_theme_name="aura"

# Starship
starship_palette="aura"

# VS Code
vscode_theme="Aura Dark"

# Zed
zed_theme="Aura Dark"

# bat / delta
# "aura" is a custom .tmTheme shipped in themes/aura/bat/, installed into
# ~/.config/bat/themes by apply-theme.sh. bat ships no Aura theme of its own.
bat_theme="aura"
delta_theme="aura"

# fzf
fzf_colors="fg:#edecee,bg:#15141b,hl:#a277ff,fg+:#edecee,bg+:#1c1b22,hl+:#a277ff,info:#61ffca,prompt:#a277ff,pointer:#ffca85,marker:#61ffca,spinner:#a277ff,header:#6d6d6d"

# borders (JankyBorders) — ARGB format 0xAARRGGBB
borders_active="0xffa277ff"
borders_inactive="0xff6d6d6d"
borders_background="0x3015141b"

# Warp (custom YAML — not built into Warp)
warp_theme="Aura-theme"
warp_custom_file="warp/aura-theme.yaml"
