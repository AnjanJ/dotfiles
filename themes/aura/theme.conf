# Theme registry for aura
# Used by apply-theme.sh — no hardcoded values needed

# Ghostty
ghostty_theme="Aura"
ghostty_custom_file="ghostty/themes/Aura"

# Neovim
nvim_plugin_file="aura-theme.lua"
nvim_colorscheme="aura-dark"

# Zellij
zellij_theme_file="aura.kdl"
zellij_theme_name="aura"

# Starship
starship_palette="aura"

# VS Code
vscode_theme="Aura Dark"

# Zed
zed_theme="Aura Dark"
