# Theme registry for aura
# Colours live in colors.toml; this file holds the settings templates
# cannot derive from a palette (editor theme names, custom files).
# Zed has no Aura in its registry; themes/aura/zed/ ships a community theme
# installed to ~/.config/zed/themes. Its internal name is "Aura Soft Dark".
# bat has no Aura either: themes/aura/bat/aura.tmTheme is installed for it.

# Neovim: plugin spec in nvim/<file>, and the colorscheme it provides
nvim_plugin_file="aura-theme.lua"
nvim_colorscheme="aura-dark"

# Editors (theme names as the apps know them)
vscode_theme="Aura Dark"
zed_theme="Aura Soft Dark"

# bat / delta syntax theme
bat_theme="aura"
delta_theme="aura"

# Warp (built-in theme name, or a custom YAML shipped in warp/)
warp_theme="Aura-theme"
warp_custom_file="warp/aura-theme.yaml"
