# Aura Dark theme for tmux
# Based on: https://github.com/daltonmenezes/aura-theme
# Hand-ported — no TPM plugin required

# Status bar
set -g status-position top
set -g status-style 'bg=#15141b fg=#edecee'

# Status left (session name)
set -g status-left-length 40
set -g status-left '#[fg=#a277ff,bold]❐ #S #[fg=#6d6d6d]│ '

# Status right (date, time, hostname)
set -g status-right-length 80
set -g status-right '#[fg=#6d6d6d]│ #[fg=#61ffca]%Y-%m-%d #[fg=#6d6d6d]│ #[fg=#82e2ff]%H:%M #[fg=#6d6d6d]│ #[fg=#61ffca]#H'

# Window status
setw -g window-status-format '#[fg=#6d6d6d] #I:#W '
setw -g window-status-current-format '#[fg=#a277ff,bold] #I:#W '

# Window status separator
setw -g window-status-separator ''

# Pane border colors
set -g pane-border-style 'fg=#6d6d6d'
set -g pane-active-border-style 'fg=#a277ff'

# Message colors
set -g message-style 'bg=#1c1b22 fg=#edecee bold'

# Mode/copy mode colors
set -g mode-style 'bg=#a277ff fg=#edecee'

# Clock
set -g clock-mode-colour '#a277ff'
