# Theme registry for flexoki-light (light)
# Colours live in colors.toml; this file holds the settings templates
# cannot derive from a palette (editor theme names, custom files).

# Neovim: plugin spec in nvim/<file>, and the colorscheme it provides
nvim_plugin_file="flexoki-light-theme.lua"
nvim_colorscheme="flexoki-light"

# Editors (theme names as the apps know them: VS Code extension
# shadesofbuntu.flexoki-light, Zed extension "flexoki-themes")
vscode_theme="flexoki-light"
zed_theme="Flexoki Light"

# bat / delta syntax theme (bat has no Flexoki; GitHub is a neutral light)
bat_theme="GitHub"
delta_theme="GitHub"

# Warp (built-in theme name, or a custom YAML shipped in warp/)
warp_theme="Flexoki-light"
warp_custom_file="warp/flexoki-light.yaml"
